<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Item - SICOGE-TI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/app/css/style.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-sm mx-auto" style="max-width: 500px;">
            <div class="card-body">
                <h4 class="mb-3">Cadastrar Novo Item</h4>
                <form id="form-cadastro">
                    <div class="mb-3">
                        <label class="form-label">Código (Patrimônio/SKU)</label>
                        <input type="text" id="codigo" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nome do Insumo</label>
                        <input type="text" id="nome" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Categoria</label>
                        <select id="categoria" class="form-select" required>
                            <option value="">Selecione...</option>
                            <option value="Impressão">Impressão (Toners, Tintas)</option>
                            <option value="Periféricos">Periféricos (Mouse, Teclado)</option>
                            <option value="Redes">Redes (Cabos, Switches)</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Quantidade Inicial</label>
                            <input type="number" id="qtd_inicial" class="form-control" required min="0">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Estoque Mínimo</label>
                            <input type="number" id="estoque_minimo" class="form-control" required min="1">
                        </div>
                    </div>
                    <div class="d-flex justify-content-between mt-3">
                        <a href="/app/dashboard.html" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Salvar Item</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="/app/js/app.js"></script>
</body>
</html>
