<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SICOGE-TI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/app/css/style.css">
</head>
<body class="bg-light">
    <!-- Barra de Navegação Superior -->
    <nav class="navbar navbar-dark bg-dark mb-3" aria-label="Navegação principal">
        <div class="container">
            <span class="navbar-brand mb-0 h1 fs-5">SICOGE-TI</span>
            <a href="/app/index.html" class="btn btn-outline-light btn-sm" style="min-height: 36px;">Sair</a>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="container">
        <!-- Cabeçalho e Botões Empilháveis no Celular -->
        <div class="row align-items-center mb-3 g-2">
            <div class="col-12 col-md-5">
                <h2 class="h4 mb-0">Estoque Atual</h2>
            </div>
            <div class="col-12 col-md-7 d-flex flex-column flex-md-row justify-content-md-end gap-2">
                <a href="/app/cadastro.html" class="btn btn-primary fw-semibold">+ Cadastrar Novo Item</a>
                <a href="/app/saida.html" class="btn btn-success fw-semibold">Registrar Movimentação</a>
            </div>
        </div>

        <!-- Barra de Busca Rápida -->
        <div class="mb-3">
            <label for="busca-estoque" class="visually-hidden">Buscar insumo por nome ou código</label>
            <input
                type="search"
                id="busca-estoque"
                class="form-control"
                placeholder="Buscar insumo por nome ou código (ex: Toner, TI-001)..."
                aria-label="Buscar insumo por nome ou código"
            >
        </div>

        <!-- VISÃO DESKTOP: Tabela Completa (Oculta em telas < 768px) -->
        <div class="card shadow-sm d-none d-md-block">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle" aria-label="Tabela de itens em estoque">
                        <thead class="table-light">
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Código</th>
                                <th scope="col">Nome do Insumo</th>
                                <th scope="col">Qtd. Atual</th>
                                <th scope="col">Mínimo</th>
                                <th scope="col">Status</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-estoque">
                            <tr>
                                <td colspan="6" class="text-center text-muted py-4">Carregando estoque...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- VISÃO CELULAR: Lista de Cards (Visível apenas em telas < 768px) -->
        <div id="cards-estoque-mobile" class="d-md-none d-flex flex-column gap-2">
            <div class="text-center text-muted py-4">Carregando estoque...</div>
        </div>
    </main>

    <script src="/app/js/app.js?v=3"></script>
</body>
</html>
